# Mastercard statements (PDF, one per month), read into rows by
# engine/banks/argenta_mastercard/statement.py; dates come out ISO, the year taken from the period
reader: statement
columns:
  required:
    asset_account_number:
      names: ["Klantenreferentie"]
      regex: "^[0-9]+$"

    statement_date:
      names: ["Afschriftdatum"]
      regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    sequence_number:
      names: ["Volgnummer"]
      regex: "^[0-9]{2,}$"

    payment_date:
      names: ["Datum transactie"]
      regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    # Empty only on a repayment line of the oldest layouts, which print one date
    primary_transaction_date:
      names: ["Datum verrekening"]
      regex: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
      date_format: "%Y-%m-%d"

    statement_text:
      names: ["Omschrijving"]
      regex: "^.+$"

    # As printed, with its sign: '1.234,56-'
    amount:
      names: ["Bedrag"]
      regex: "^[0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2}[-+]$"

    account_currency_code:
      names: ["Munt"]
      regex: "^.+$"

    foreign_amount:
      names: ["Origineel bedrag"]
      regex: "^([0-9]{1,3}(\\.[0-9]{3})*,[0-9]{2})?$"

    foreign_currency_code:
      names: ["Originele munt"]
      regex: "^([A-Z]{3})?$"

    exchange_rate:
      names: ["Koers"]
      regex: "^([0-9]+,[0-9]+)?$"

    card_number:
      names: ["Kaartnummer"]

    card_holder:
      names: ["Kaarthouder"]

    # Set by the reader: the line a 'KOSTEN OP GELDOPNEMING' line follows
    is_cash_withdrawal:
      names: ["Geldopneming"]
      regex: "^1?$"

duplicate_key:
  # A line has no reference of its own; a statement never changes, so its date and the line's
  # place on it identify the line, also two identical lines
  columns: ["statement_date", "sequence_number"]
  partition_by: "asset_account_number"
