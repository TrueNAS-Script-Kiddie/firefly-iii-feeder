# Current and savings accounts (xlsx export, one account per file)
columns:
  required:
    external_id:
      names: ["Referentie"]
      # Booking date coded in the first five characters (checked by the module)
      regex: "^[A-Z][0-9][A-L][0-9]{2}[A-Z0-9]{11}$"

    primary_transaction_date:
      names: ["Boekdatum"]
      regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
      # strptime format; gives the period in the output file names
      date_format: "%Y-%m-%d"

    interest_date:
      names: ["Valutadatum"]
      regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    transaction_processing_date:
      names: ["Verrichtingsdatum"]
      regex: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"

    asset_account_iban:
      names: ["Rekening"]
      regex: "^[A-Z]{2}[0-9]{2}[0-9A-Z ]{11,40}$"

    transaction_type:
      names: ["Beschrijving"]
      regex: "^.+$"

    amount:
      names: ["Bedrag"]
      regex: "^-?[0-9]+(\\.[0-9]+)?$"

    account_currency_code:
      names: ["Munt"]
      regex: "^.+$"

    opposing_account_iban:
      names: ["Rekening tegenpartij"]

    opposing_account_name:
      names: ["Naam tegenpartij"]

    description:
      names: ["Mededeling"]

duplicate_key:
  # Referentie alone is not unique: an expired term deposit books principal and interest under one
  columns: ["external_id", "amount"]
  partition_by: "asset_account_iban"
